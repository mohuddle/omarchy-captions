[project]
name = "omarchy-captions"
version = "0.1.0"
description = "Live captions of speaker audio for Omarchy: PipeWire + sherpa-onnx, TUI and bar plugin."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["sherpa-onnx"]

[project.scripts]
captions = "captions.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["captions*"]
